# Analyzer configuration for Kadd.
# Keep the project's recommended Flutter lints enabled while avoiding a
# build-blocking false positive for intentionally retained private fields that
# are part of the ML/camera tuning surface.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_field: ignore

linter:
  rules:
    # Keep Flutter's recommended rules from flutter_lints.
