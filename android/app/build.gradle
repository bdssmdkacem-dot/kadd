plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.comptaflow.kadd"
    compileSdk 35

    defaultConfig {
        applicationId "com.comptaflow.kadd"
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders = [
            KADD_ADMOB_APP_ID: System.getenv('KADD_ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713'
        ]
    }

    // Production signing is supplied by CI/secret infrastructure only.
    // Local and ordinary verification builds continue using the generated
    // Android debug key so no signing secret is committed to the repository.
    signingConfigs {
        release {
            def releaseKeystore = System.getenv('KADD_RELEASE_KEYSTORE')
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KADD_RELEASE_STORE_PASSWORD') ?: ''
                keyAlias System.getenv('KADD_RELEASE_KEY_ALIAS') ?: ''
                keyPassword System.getenv('KADD_RELEASE_KEY_PASSWORD') ?: ''
            } else {
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

flutter { source '../..' }

tasks.register('installKaddNativeAdditions') {
    doLast {
        def src = file('../../android_additions/kotlin')
        def dst = file('src/main/kotlin/com/comptaflow/kadd')
        if (src.exists()) {
            copy { from src; into dst; include '*.kt' }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'installKaddNativeAdditions' }
