plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.comptaflow.kadd"
    compileSdk 35

    defaultConfig {
        applicationId "com.comptaflow.kadd"
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // The APK distributed from GitHub Actions must be signed. Until a
    // production keystore is configured, use Android's generated debug key
    // for the release artifact so Android devices can install the APK.
    signingConfigs {
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

flutter { source '../..' }

tasks.register('installKaddNativeAdditions') {
    doLast {
        def src = file('../../android_additions/kotlin')
        def dst = file('src/main/kotlin/com/comptaflow/kadd')
        if (src.exists()) {
            copy { from src; into dst; include '*.kt' }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'installKaddNativeAdditions' }
