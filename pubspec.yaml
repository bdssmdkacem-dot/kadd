name: kadd
description: "كدّ — قفل التطبيقات بالمجهود وبالتزام الصلاة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # Fonts
  google_fonts: ^6.2.1

  # Camera + ML Kit
  camera: ^0.10.6
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_image_labeling: ^0.14.2

  # File access
  path_provider: ^2.1.4
  path: ^1.9.0

  # Prayer times
  geolocator: ^12.0.0
  http: ^1.2.1

  # Internationalization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#12151B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icon/

  fonts: []