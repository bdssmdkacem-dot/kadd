name: kadd
description: "كدّ — قفل التطبيقات بالمجهود وبالتزام الصلاة"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Local persistence
  shared_preferences: ^2.5.5

  # Fonts
  google_fonts: ^6.3.3

  # Camera
  camera: ^0.10.6

  # Google ML Kit
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_image_labeling: ^0.14.2

  # File utilities
  path_provider: ^2.1.6
  path: ^1.9.1

  # Networking
  http: ^1.6.0

  # Installed applications
  installed_apps: ^2.1.1

  # Internationalization
  intl: ^0.19.0

  # Google Mobile Ads
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#12151B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icon/

  fonts: []
