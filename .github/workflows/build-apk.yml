name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

     - name: Setup Gradle
        uses: gradle/gradle-build-action@v2


      # Keep the repository's Android project as the source of truth. Flutter
      # creates a default MainActivity when generating a platform folder, so
      # remove that generated class before installing Kadd's native activity.
      - name: Prepare Android platform
        run: |
          test -f android/settings.gradle
          rm -f android/app/src/main/kotlin/com/comptaflow/kadd/MainActivity.kt

      - name: Copy native Kotlin sources into the Android project
        run: |
          mkdir -p android/app/src/main/kotlin/com/comptaflow/kadd
          cp android_additions/kotlin/*.kt android/app/src/main/kotlin/com/comptaflow/kadd/

      - name: Patch AndroidManifest.xml with Kadd permissions/service/receivers
        run: python3 scripts/patch_manifest.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Diagnostics
        if: always()
        run: |
          flutter --version
          dart --version
          flutter doctor -v
          echo "--- Android project ---"
          find android/app/src/main -maxdepth 5 -type f | sort
          echo "--- android/settings.gradle ---"
          cat android/settings.gradle
          echo "--- android/app/build.gradle ---"
          cat android/app/build.gradle

      - name: Build release APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
