name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.comptaflow .

      - name: Install canonical Kadd native sources
        run: |
          mkdir -p android/app/src/main/kotlin/com/comptaflow/kadd
          cp android_additions/kotlin/*.kt android/app/src/main/kotlin/com/comptaflow/kadd/

      - name: Patch generated Android project
        run: python3 scripts/patch_manifest.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore analyzer configuration
        run: git checkout -- analysis_options.yaml

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_ADMOB_BANNER_ID: ${{ secrets.KADD_ADMOB_BANNER_ID }}
          KADD_ADMOB_INTERSTITIAL_ID: ${{ secrets.KADD_ADMOB_INTERSTITIAL_ID }}
        shell: bash
        run: |
          dart_defines=()
          if [ -n "$KADD_ADMOB_BANNER_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_BANNER_ID=$KADD_ADMOB_BANNER_ID")
          fi
          if [ -n "$KADD_ADMOB_INTERSTITIAL_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_INTERSTITIAL_ID=$KADD_ADMOB_INTERSTITIAL_ID")
          fi
          flutter build apk --release "${dart_defines[@]}"

      - name: Build release AAB
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_ADMOB_BANNER_ID: ${{ secrets.KADD_ADMOB_BANNER_ID }}
          KADD_ADMOB_INTERSTITIAL_ID: ${{ secrets.KADD_ADMOB_INTERSTITIAL_ID }}
        shell: bash
        run: |
          dart_defines=()
          if [ -n "$KADD_ADMOB_BANNER_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_BANNER_ID=$KADD_ADMOB_BANNER_ID")
          fi
          if [ -n "$KADD_ADMOB_INTERSTITIAL_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_INTERSTITIAL_ID=$KADD_ADMOB_INTERSTITIAL_ID")
          fi
          flutter build appbundle --release "${dart_defines[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kadd-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
