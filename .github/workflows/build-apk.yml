name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision CI debug keystore
        shell: bash
        run: |
          # The Android Gradle plugin on this runner resolves its debug key at
          # $ANDROID_USER_HOME/debug.keystore. Keep compatibility copies in
          # the conventional .android locations as well.
          ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.config}"
          export ANDROID_USER_HOME
          PRIMARY_KEYSTORE="$ANDROID_USER_HOME/debug.keystore"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_USER_HOME/.android" "$HOME/.android"

          if [ ! -s "$PRIMARY_KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$PRIMARY_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cp "$PRIMARY_KEYSTORE" "$ANDROID_USER_HOME/.android/debug.keystore"
          cp "$PRIMARY_KEYSTORE" "$HOME/.android/debug.keystore"
          test -s "$PRIMARY_KEYSTORE"
          test -s "$ANDROID_USER_HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Android platform
        run: |
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/comptaflow/kadd/MainActivity.kt
          test -d android_additions/kotlin

      - name: Copy native Kotlin sources into the Android project
        run: |
          mkdir -p android/app/src/main/kotlin/com/comptaflow/kadd
          cp android_additions/kotlin/*.kt android/app/src/main/kotlin/com/comptaflow/kadd/

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore analyzer configuration
        run: git checkout -- analysis_options.yaml

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Configure optional release signing
        env:
          KADD_RELEASE_KEYSTORE: ${{ secrets.KADD_RELEASE_KEYSTORE_PATH }}
        run: |
          if [ -n "$KADD_RELEASE_KEYSTORE" ] && [ ! -f "$KADD_RELEASE_KEYSTORE" ]; then
            echo "Configured release keystore path does not exist: $KADD_RELEASE_KEYSTORE"
            exit 1
          fi

      - name: Clean Android build outputs
        run: flutter clean

      - name: Verify CI signing key
        run: |
          test -s "$ANDROID_USER_HOME/debug.keystore"
          test -s "$ANDROID_USER_HOME/.android/debug.keystore"
          keytool -list -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build release APK
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_RELEASE_KEYSTORE: ${{ secrets.KADD_RELEASE_KEYSTORE_PATH }}
          KADD_RELEASE_STORE_PASSWORD: ${{ secrets.KADD_RELEASE_STORE_PASSWORD }}
          KADD_RELEASE_KEY_ALIAS: ${{ secrets.KADD_RELEASE_KEY_ALIAS }}
          KADD_RELEASE_KEY_PASSWORD: ${{ secrets.KADD_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build release AAB
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_RELEASE_KEYSTORE: ${{ secrets.KADD_RELEASE_KEYSTORE_PATH }}
          KADD_RELEASE_STORE_PASSWORD: ${{ secrets.KADD_RELEASE_STORE_PASSWORD }}
          KADD_RELEASE_KEY_ALIAS: ${{ secrets.KADD_RELEASE_KEY_ALIAS }}
          KADD_RELEASE_KEY_PASSWORD: ${{ secrets.KADD_RELEASE_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kadd-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
