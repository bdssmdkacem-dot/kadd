name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK and install API 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.comptaflow .

      - name: Install canonical Kadd native sources
        run: |
          mkdir -p android/app/src/main/kotlin/com/comptaflow/kadd
          cp android_additions/kotlin/*.kt android/app/src/main/kotlin/com/comptaflow/kadd/

      - name: Patch generated Android project
        run: python3 scripts/patch_manifest.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore analyzer configuration
        run: git checkout -- analysis_options.yaml

      - name: Remove Flutter-generated sample test
        run: rm -f test/widget_test.dart

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_ADMOB_BANNER_ID: ${{ secrets.KADD_ADMOB_BANNER_ID }}
          KADD_ADMOB_INTERSTITIAL_ID: ${{ secrets.KADD_ADMOB_INTERSTITIAL_ID }}
        shell: bash
        run: |
          dart_defines=()
          if [ -n "$KADD_ADMOB_BANNER_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_BANNER_ID=$KADD_ADMOB_BANNER_ID")
          fi
          if [ -n "$KADD_ADMOB_INTERSTITIAL_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_INTERSTITIAL_ID=$KADD_ADMOB_INTERSTITIAL_ID")
          fi
          flutter build apk --release "${dart_defines[@]}"

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop com.comptaflow.kadd
            adb shell monkey -p com.comptaflow.kadd 1
            sleep 10

            echo "=== Activity state ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|mFocusedApp" || true

            echo "=== Process check ==="
            pid="$(adb shell pidof com.comptaflow.kadd | tr -d '')"
            if [ -z "$pid" ]; then
              echo "Kadd process is not running after launch."
              adb logcat -d -t 500
              exit 1
            fi
            echo "Kadd process is running with PID $pid"

            echo "=== Fatal Android exceptions ==="
            fatal="$(adb logcat -d -t 1000 | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com.comptaflow.kadd" || true)"
            if [ -n "$fatal" ]; then
              echo "$fatal"
              adb logcat -d -t 1000
              exit 1
            fi

            echo "Kadd release APK launch smoke test passed."

      - name: Build release AAB
        env:
          KADD_ADMOB_APP_ID: ${{ secrets.KADD_ADMOB_APP_ID }}
          KADD_ADMOB_BANNER_ID: ${{ secrets.KADD_ADMOB_BANNER_ID }}
          KADD_ADMOB_INTERSTITIAL_ID: ${{ secrets.KADD_ADMOB_INTERSTITIAL_ID }}
        shell: bash
        run: |
          dart_defines=()
          if [ -n "$KADD_ADMOB_BANNER_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_BANNER_ID=$KADD_ADMOB_BANNER_ID")
          fi
          if [ -n "$KADD_ADMOB_INTERSTITIAL_ID" ]; then
            dart_defines+=("--dart-define=KADD_ADMOB_INTERSTITIAL_ID=$KADD_ADMOB_INTERSTITIAL_ID")
          fi
          flutter build appbundle --release "${dart_defines[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kadd-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
