name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository now contains the complete Android project. Do not run
      # flutter create or patch the manifest at build time: the committed
      # manifest already contains Kadd's permissions and native components.
      - name: Validate Android platform
        run: |
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/comptaflow/kadd/MainActivity.kt || true

      - name: Copy native Kotlin sources into the Android project
        run: |
          mkdir -p android/app/src/main/kotlin/com/comptaflow/kadd
          cp android_additions/kotlin/*.kt android/app/src/main/kotlin/com/comptaflow/kadd/

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # A release APK without a signing certificate is rejected by Android as
      # an invalid package. Create the standard Android debug key on the CI
      # runner when it does not already exist; build.gradle uses this key for
      # the installable release artifact until a production keystore is added.
      - name: Ensure Android signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Diagnostics
        if: always()
        run: |
          flutter --version
          dart --version
          flutter doctor -v
          echo "--- Android project ---"
          find android/app/src/main -maxdepth 5 -type f | sort
          echo "--- Android manifest ---"
          cat android/app/src/main/AndroidManifest.xml
          echo "--- android/settings.gradle ---"
          cat android/settings.gradle
          echo "--- android/app/build.gradle ---"
          cat android/app/build.gradle

      - name: Build release APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
